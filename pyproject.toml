[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-paper-trading-mvp"
version = "0.1.0"
description = "Safe, swing-trading paper trading MVP for US equities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30,<1"]
dashboard = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[project.scripts]
paper-trading = "paper_trading.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
